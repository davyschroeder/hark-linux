name: Build Hark Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "docs/**", "LICENSE"]

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386]
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Build ISO (live-build in a Debian container)
        run: |
          set -o pipefail
          chmod +x build.sh auto/* config/hooks/normal/* config/includes.chroot/usr/local/bin/*
          ./build.sh ${{ matrix.arch }} docker 2>&1 | tee ci-build.log

      - name: Show extras log
        if: always()
        run: sudo cat chroot/var/log/hark-extras.log || true

      - name: Show end of build log
        if: failure()
        run: sudo tail -n 200 build.log || true

      - name: Publish logs to branch ci-logs-${{ matrix.arch }}
        if: always()
        run: |
          mkdir -p /tmp/logs
          tail -n 4000 ci-build.log > /tmp/logs/build.log 2>/dev/null || true
          sudo cat chroot/var/log/hark-extras.log > /tmp/logs/extras.log 2>/dev/null || true
          echo "run ${{ github.run_id }} sha ${{ github.sha }} job ${{ job.status }}" > /tmp/logs/STATUS
          cd /tmp/logs && git init -q -b logs && git add -A
          git -c user.name=hark-ci -c user.email=ci@invalid commit -qm "logs ${{ matrix.arch }} run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ matrix.arch }}

      - name: Collect ISO
        run: |
          sudo chown "$(id -u):$(id -g)" ./*.iso
          ls -lh ./*.iso
          sha256sum ./*.iso > SHA256SUMS-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hark-linux-${{ matrix.arch }}
          path: |
            *.iso
            SHA256SUMS-*.txt
          compression-level: 0
          retention-days: 14

      - name: Attach to release (tags only; skipped if the ISO is over 2 GB)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            SHA256SUMS-*.txt
