name: Build Hark Linux ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386]
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Build ISO (live-build in a Debian container)
        run: |
          chmod +x build.sh auto/* config/hooks/normal/* config/includes.chroot/usr/local/bin/*
          ./build.sh ${{ matrix.arch }} docker

      - name: Show extras log
        if: always()
        run: sudo cat chroot/var/log/hark-extras.log || true

      - name: Show end of build log
        if: failure()
        run: sudo tail -n 200 build.log || true

      - name: Collect ISO
        run: |
          sudo chown "$(id -u):$(id -g)" ./*.iso
          ls -lh ./*.iso
          sha256sum ./*.iso > SHA256SUMS-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hark-linux-${{ matrix.arch }}
          path: |
            *.iso
            SHA256SUMS-*.txt
          compression-level: 0
          retention-days: 14

      - name: Attach to release (tags only; skipped if the ISO is over 2 GB)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            SHA256SUMS-*.txt
