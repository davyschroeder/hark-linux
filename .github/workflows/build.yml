name: Build Hark Linux ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            image: debian:trixie
          - arch: i386
            image: debian:bookworm
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: apt-get update && apt-get install -y live-build debootstrap ca-certificates curl
      - name: Build ISO
        run: ./build.sh ${{ matrix.arch }} native
      - name: Show extras log
        if: always()
        run: cat chroot/var/log/hark-extras.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: hark-linux-${{ matrix.arch }}
          path: "*.iso"
          retention-days: 7
      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.iso"
