[General]
__userfile__=true
panels=panel1

[panel1]
alignment=-1
animation-duration=0
desktop=0
hidable=false
iconSize=26
lineCount=1
lockPanel=false
opacity=95
panelSize=34
plugins=harkknop, snelstart, taskbar, tray, statusnotifier, volume, cpuload, worldclock
position=Bottom
width=100
width-percent=true

[harkknop]
type=quicklaunch
alignment=Left
apps\1\desktop=/usr/share/applications/hark-menu.desktop
apps\size=1

[snelstart]
type=quicklaunch
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/terminator.desktop
apps\3\desktop=/usr/share/applications/firefox-esr.desktop
apps\size=3

[taskbar]
type=taskbar
alignment=Left
buttonWidth=200
groupingEnabled=false

[tray]
type=tray
alignment=Right

[statusnotifier]
type=statusnotifier
alignment=Right

[volume]
type=volume
alignment=Right
audioEngine=PulseAudio

[cpuload]
type=cpuload
alignment=Right
showText=false

[worldclock]
type=worldclock
alignment=Right
formatType=custom-timeonly
customFormat='<b>'HH:mm'</b>'
